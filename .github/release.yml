changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: ✨ New features
      labels: [enhancement, feature]
    - title: 🐞 Bug fixes
      labels: [bug, fix]
    - title: 🎨 Design
      labels: [design, ui]
    - title: 📝 Documentation
      labels: [docs, documentation]
    - title: 🔧 Other changes
      labels: ["*"]
