name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyflakes
      - name: Lint
        run: python -m pyflakes umbra main.py tools
      - name: Compile check
        run: python -m compileall -q umbra main.py
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name Umbra
          --icon umbra/assets/umbra.ico
          --add-data "umbra/assets;umbra/assets"
          --collect-all sounddevice --collect-all soundfile --collect-data yt_dlp
          main.py
      - name: Zip
        run: Compress-Archive -Path dist/Umbra/* -DestinationPath Umbra-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Umbra-windows
          path: Umbra-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Umbra-windows.zip
          generate_release_notes: true
